{
  // osquery configuration written by `kite-collector install --with-osquery`
  // on macOS.
  //
  // Installed to:  <certs-dir>/osquery/osquery.conf
  //                (default /var/lib/kite-collector/osquery/osquery.conf)
  // Loaded via:    --config_path on the kite-osqueryd launchd job
  //                (internal/installer.BuildHostOsquerySvcConfig)
  //
  // Unlike the deb and the MSI, macOS has no vendored osqueryd payload: the
  // daemon binary belongs to the operator's own osquery install (the official
  // pkg or `brew install --cask osquery`, both of which lay down
  // /opt/osquery/lib/osquery.app). Only the configuration, the state
  // directory, and the launchd job are kite's — which is why every path flag
  // is passed on the job's command line rather than written here.
  //
  // The schedule is a deliberately small heartbeat: the collector's osquery
  // discovery source reads tables on demand over the extensions socket, so the
  // schedule only proves liveness and exercises the core inventory tables.

  "options": {
    // Splay scheduled queries to avoid synchronized load spikes.
    "schedule_splay_percent": "10"
  },

  "schedule": {
    // Hourly host heartbeat — mirrors the upstream default example query.
    "system_info": {
      "query": "SELECT hostname, uuid, cpu_brand, physical_memory FROM system_info;",
      "interval": 3600,
      "snapshot": true
    },
    // Daily OS inventory — the table CVE matching cares about most.
    "os_version": {
      "query": "SELECT name, version, major, minor, build, platform FROM os_version;",
      "interval": 86400,
      "snapshot": true
    },
    // Daily installed-software inventory. `apps` is the macOS analogue of the
    // deb bundle's deb_packages and the MSI bundle's programs: it enumerates
    // the .app bundles under /Applications and ~/Applications.
    "apps": {
      "query": "SELECT name, bundle_short_version, bundle_identifier, path FROM apps;",
      "interval": 86400,
      "snapshot": true
    }
  },

  // Decorators append host identity to every result row, matching the
  // upstream default so downstream consumers can rely on host_uuid.
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system_info;",
      "SELECT user AS username FROM logged_in_users ORDER BY time DESC LIMIT 1;"
    ]
  },

  // File-integrity monitoring is OFF by default: no file_paths means no
  // watches are armed, which is what keeps an install that did not ask for FIM
  // free. Uncomment and adapt to turn it on — --enable_file_events is already
  // set in osquery.flags, so configuring paths here is the only remaining
  // step.
  //
  // Keep the FIM categories below DISJOINT from any yara_events file_paths.
  // On Linux that is load-bearing (the inotify publisher binds each kernel
  // watch to exactly one subscriber, so an overlapping yara_events category
  // silently steals the watch and FIM goes deaf); macOS uses the FSEvents
  // publisher instead, so the mechanism differs, but overlapping categories
  // remain untested here and are not worth the risk.
  //
  // "file_paths": {
  //   "launch_items": [
  //     "/Library/LaunchDaemons/%%",
  //     "/Library/LaunchAgents/%%"
  //   ],
  //   "binaries": [
  //     "/usr/local/bin/%%",
  //     "/opt/homebrew/bin/%%"
  //   ],
  //   "etc": [
  //     "/etc/%%"
  //   ]
  // },

  // Community packs ship with the operator's osquery install, not with kite.
  // The official macOS pkg puts them under
  // /opt/osquery/share/osquery/packs/. All are disabled by default: they
  // generate meaningful log volume and nothing ships those logs anywhere yet.
  // Uncomment deliberately.
  "packs": {
    // "osx-attacks": "/opt/osquery/share/osquery/packs/osx-attacks.conf",
    // "incident-response": "/opt/osquery/share/osquery/packs/incident-response.conf",
    // "it-compliance": "/opt/osquery/share/osquery/packs/it-compliance.conf",
    // "vuln-management": "/opt/osquery/share/osquery/packs/vuln-management.conf",
    // "hardware-monitoring": "/opt/osquery/share/osquery/packs/hardware-monitoring.conf",
    // "osquery-monitoring": "/opt/osquery/share/osquery/packs/osquery-monitoring.conf"
  }
}
