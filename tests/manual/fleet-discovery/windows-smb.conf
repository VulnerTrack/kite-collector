[global]
   netbios name = WIN-KITE-TEST
   workgroup = WORKGROUP
   server string = Windows Test Computer
   security = user
   map to guest = Bad User
   interfaces = eth0
   bind interfaces only = yes
   smb ports = 445 139
   disable spoolss = yes

[Public]
   path = /srv/public
   browseable = yes
   read only = no
   guest ok = yes
