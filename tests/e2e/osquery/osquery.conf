{
  "options": {
    "disable_events": "false",
    "enable_file_events": "true"
  },
  "schedule": {
    "processes_snapshot": {
      "query": "SELECT pid, name FROM processes LIMIT 20;",
      "interval": 60,
      "snapshot": true
    }
  },
  "file_paths": {
    "kite_fim": [
      "/var/kite/watch/fim/%%"
    ],
    "kite_yara": [
      "/var/kite/watch/yara/%%"
    ]
  },
  "yara": {
    "signatures": {
      "kite_sigs": [
        "/etc/osquery/yara/kite.yar"
      ]
    },
    "file_paths": {
      "kite_yara": [
        "kite_sigs"
      ]
    }
  }
}
