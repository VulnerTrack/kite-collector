{
  // osquery configuration shipped by the kite-collector-osquery Windows MSI.
  //
  // Installed to:  C:\Program Files\Kite Collector\osquery\osquery.conf
  // Loaded via:    --config_path on the kite-osqueryd service command line
  //                (see cmd/kite-collector/wix.wxs, ServiceInstall Arguments)
  //
  // Path flags (--database_path, --logger_path, --extensions_socket) are NOT
  // set here — the MSI passes them on the service command line so a relocated
  // install ([INSTALLFOLDER]/CERTSDIR overrides) keeps working. Behavioral
  // flags live in osquery.flags next to this file.
  //
  // The scheduled queries below are deliberately conservative: nothing
  // consumes the filesystem result logs yet (the collector's osquery client
  // is future work — see tests/e2e/osquery/README.md), so the schedule only
  // keeps a small heartbeat that proves the daemon is alive and exercises
  // the tables an osquery-backed collector is expected to consume.

  "options": {
    // Splay scheduled queries to avoid synchronized load spikes.
    "schedule_splay_percent": "10"
  },

  "schedule": {
    // Hourly host heartbeat — mirrors the upstream default example query.
    "system_info": {
      "query": "SELECT hostname, uuid, cpu_brand, physical_memory FROM system_info;",
      "interval": 3600,
      "snapshot": true
    },
    // Daily OS inventory — cheap, and the table the collector's CVE matching
    // cares about most.
    "os_version": {
      "query": "SELECT name, version, major, minor, build, platform FROM os_version;",
      "interval": 86400,
      "snapshot": true
    },
    // Daily installed-software inventory (Windows analogue of deb_packages).
    "programs": {
      "query": "SELECT name, version, publisher, install_location FROM programs;",
      "interval": 86400,
      "snapshot": true
    }
  },

  // Decorators append host identity to every result row, matching the
  // upstream default so downstream consumers can rely on host_uuid.
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system_info;",
      "SELECT user AS username FROM logged_in_users ORDER BY time DESC LIMIT 1;"
    ]
  },

  // Bundled community packs (installed under ...\osquery\packs). All disabled
  // by default — they generate meaningful log volume and nothing ships those
  // logs anywhere yet. Uncomment deliberately.
  "packs": {
    // "windows-hardening": "C:\\Program Files\\Kite Collector\\osquery\\packs\\windows-hardening.conf",
    // "windows-attacks": "C:\\Program Files\\Kite Collector\\osquery\\packs\\windows-attacks.conf",
    // "vuln-management": "C:\\Program Files\\Kite Collector\\osquery\\packs\\vuln-management.conf",
    // "incident-response": "C:\\Program Files\\Kite Collector\\osquery\\packs\\incident-response.conf",
    // "it-compliance": "C:\\Program Files\\Kite Collector\\osquery\\packs\\it-compliance.conf",
    // "osquery-monitoring": "C:\\Program Files\\Kite Collector\\osquery\\packs\\osquery-monitoring.conf"
  }
}
