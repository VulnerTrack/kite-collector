# CI/CD Pipeline for kite-collector — RFC-0051, extended by RFC-0148.
# Runs on every push/PR to main. Release on v* tags.
#
# RFC-0148 added the container QA suites (qa-e2e, qa-smoke-containers,
# qa-kite-containers) as pull-request gates. Two facts about this repository's
# layout drive where that wiring lives, and they are worth recording because
# RFC-0148 was drafted believing the opposite:
#
#   * This IS the repository root. `.github/workflows/` here is the directory
#     GitHub Actions scans for VulnerTrack/kite-collector, so these workflows
#     do run. They are not the "dead nested directory" RFC-0148 Section 2.1
#     describes.
#   * vulnertrack-intelligence-engine does NOT track this module. It was
#     untracked deliberately (`chore(kite-collector): untrack submodule and
#     register as sibling repo`) and is listed in that repo's .gitignore under
#     "Sibling-repo symlinks ... not tracked here", with no .gitmodules.
#     `git ls-files --error-unmatch apps/kite-collector/go.mod` exits non-zero
#     there.
#
# Together those mean a PR carrying a change to this Go module is opened
# against THIS repository, so this is the only place a required status check
# can gate it. Relocating these jobs into the monorepo root — RFC-0148's
# literal Phase 1 — would produce jobs whose `paths: apps/kite-collector/**`
# filter can never match and whose `working-directory` would not exist in the
# checkout. The RFC's intent (R1/R2) is satisfied here instead.
name: Kite Collector

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

# R3: `pull_request`, never `pull_request_target`, so a forked PR branch runs
# with a read-only, secretless GITHUB_TOKEN. No repository secret is referenced
# anywhere in this file — the trusted ingestion path lives in
# kite-qa-ingest.yml, which never checks out PR-branch code.
permissions:
  contents: read

# R5: a superseding push to the same PR/branch cancels the in-flight run,
# including the container QA jobs.
concurrency:
  group: kite-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  CGO_ENABLED: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────
  # Phase 1: Quality Gates (parallel)
  # ──────────────────────────────────────────────

  vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: golangci-lint run --timeout=5m ./...

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -exclude-generated ./...

  test:
    runs-on: ubuntu-24.04
    # The SQLite and dashboard packages apply the complete embedded migration
    # catalog in isolated temp databases, and the coverage test wave grew the
    # suite further. GitHub's shared runners run it 2-3x slower than local
    # (~10 min): the v0.53.2 tag's test job was killed at exactly 30:19 by
    # the old 30-minute ceiling. go test's own -timeout stays 30m — that
    # bound is per test binary, not the whole run.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Reject generated collector binaries in Git
        run: |
          tracked_binaries="$(git ls-files -- \
            internal/dashboard/assets/kite-collector_windows_386_legacy.exe \
            kite-collector.new \
            kite-collector.release)"
          if [ -n "$tracked_binaries" ]; then
            echo "::error::Generated collector binaries must come from CI artifacts/releases, not Git."
            echo "$tracked_binaries"
            exit 1
          fi
      - name: Run tests
        run: go test -count=1 -timeout 30m -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 30

  legacy-windows7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.17.13"
      - name: Test isolated Windows 7 module
        working-directory: legacy/windows7
        run: go test -count=1 ./...
      - name: Cross-compile Windows 7 agent outside the checkout
        working-directory: legacy/windows7
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=386 GO386=softfloat \
            go build -trimpath -ldflags="-X main.version=ci-${GITHUB_SHA::8}" \
            -o "$RUNNER_TEMP/kite-collector_windows_386_legacy.exe" .
          test -s "$RUNNER_TEMP/kite-collector_windows_386_legacy.exe"

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Phase 1b: Container QA suites (parallel) — RFC-0148 R1
  #
  # These suites already existed and already worked; the only new thing is
  # that they now run on a pull request instead of never. Each delegates to
  # the shared kite-qa-suite action for the infrastructure-classified retry,
  # the distinguishable annotations (Section 7.4) and the step-summary table
  # (R9).
  #
  # `if: !startsWith(...refs/tags/v)` mirrors `build`: RFC-0148 Section 2.2
  # keeps the release path untouched, and Section 12 leaves "should the new
  # required checks also apply to tag-triggered runs" an open question, so a
  # tag push behaves exactly as it did before this RFC.
  #
  # Job ids double as check-run names, which is the namespace GitHub branch
  # protection matches on. Renaming one silently drops it from the required
  # list, so treat these three as a stable API (R2).
  # ──────────────────────────────────────────────

  qa-e2e:
    name: qa-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/kite-qa-suite
        with:
          suite-slug: e2e-testcontainers
          make-target: test-e2e
          log-file: qa-e2e.log
      # R8: 30 days is the floor RFC-0148 sets for QA logs, deliberately
      # shorter than build_artifacts' 90-day default.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-e2e-log
          path: qa-e2e.log
          retention-days: 30
          if-no-files-found: warn

  # Plain collector deb battery: package installs sans systemd, unit ships
  # at /usr/lib, binary at /usr/bin (dpkg-owned, so `install` adopts), and
  # the /usr/local/bin→/usr/bin upgrade bridge creates/preserves/cleans its
  # compat symlink. Includes the config drift guard between .goreleaser.yaml
  # and the battery's mirrored nfpm-collector.yaml.
  qa-deb-collector:
    name: qa-deb-collector
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/kite-qa-suite
        with:
          suite-slug: deb-collector
          make-target: test-deb-collector
          log-file: qa-deb-collector.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-deb-collector-log
          path: qa-deb-collector.log
          retention-days: 30
          if-no-files-found: warn

  qa-smoke-containers:
    name: qa-smoke-containers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/kite-qa-suite
        with:
          suite-slug: containers-smoke
          make-target: test-smoke-containers
          log-file: qa-smoke-containers.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-smoke-containers-log
          path: qa-smoke-containers.log
          retention-days: 30
          if-no-files-found: warn

  qa-kite-containers:
    name: qa-kite-containers
    runs-on: ubuntu-24.04
    # 15, not the 10 the other two use: RFC-0148 Section 11.3 budgets this
    # suite at ~6 minutes on its own and Section 8.2 also asks for one retry.
    # 6 + 6 does not fit in 10. Section 8.1 sanctions the 10-20 minute band.
    timeout-minutes: 15
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/kite-qa-suite
        with:
          suite-slug: kite-containers-smoke
          make-target: test-kite-containers
          log-file: qa-kite-containers.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-kite-containers-log
          path: qa-kite-containers.log
          retention-days: 30
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Phase 2: Build (after all gates pass)
  # ──────────────────────────────────────────────

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # RFC-0148 wires the three container QA suites in here as well, so a
    # binary is never produced from a tree whose container contracts fail.
    # `release` deliberately keeps the pre-RFC needs list (Section 2.2).
    needs:
      - vet
      - lint
      - security
      - test
      - legacy-windows7
      - qa-e2e
      - qa-deb-collector
      - qa-smoke-containers
      - qa-kite-containers
    if: "!startsWith(github.ref, 'refs/tags/v')"
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Embed the Windows app manifest (UAC requireAdministrator +
      # Common-Controls 6.0) before the Windows build, so the wizard binary
      # ships with the resources it needs. The .syso is named with the
      # _windows_amd64 suffix so the Go toolchain links it only into the
      # matching matrix cell — no-op on linux/darwin builds.
      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest cmd/kite-collector/app.manifest \
               -arch ${{ matrix.goarch }} \
               -o cmd/kite-collector/rsrc_windows_${{ matrix.goarch }}.syso
      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags="-s -w \
            -X main.version=${{ github.ref_name }} \
            -X main.commit=${{ github.sha }} \
            -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o kite-collector-${{ matrix.goos }}-${{ matrix.goarch }} \
          ./cmd/kite-collector
      - uses: actions/upload-artifact@v7
        with:
          name: kite-collector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kite-collector-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30

  # ──────────────────────────────────────────────
  # Phase 3: Release (v* tags only)
  # ──────────────────────────────────────────────

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [vet, lint, security, test, legacy-windows7]
    if: startsWith(github.ref, 'refs/tags/v')
    # Bind to the "Deployment" environment so the job can access environment-
    # scoped secrets (notably HOMEBREW_TAP_GITHUB_TOKEN). Repository-scoped
    # secrets are visible everywhere; environment-scoped secrets only fire
    # for jobs that opt in here. Also enables protection rules (required
    # reviewers, wait timers, branch restrictions) on the release flow.
    environment: Deployment
    permissions:
      contents: write
      pages: write # Requerido para actualizar la rama gh-pages sin fricciones
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies (dpkg-dev, WiX, snapcraft)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev msitools wixl
          sudo snap install snapcraft --classic

      # Embed the Windows app manifest (UAC requireAdministrator +
      # Common-Controls 6.0) before the Windows build in the goreleaser
      # matrix. Same step as the per-PR build job above, but lives in
      # the release job so a release-only push (push to tag without
      # touching main) still produces a properly-manifested .exe.
      - name: Generate Windows resources
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest cmd/kite-collector/app.manifest \
               -arch amd64 \
               -o cmd/kite-collector/rsrc_windows_amd64.syso

      - name: Diagnose secret presence (length only — values are masked)
        # Confirms whether HOMEBREW_TAP_GITHUB_TOKEN is set on THIS repo at
        # THIS workflow ref. Length-only print; GitHub redacts secret values
        # in logs, but ${#VAR} is the integer length and is safe to log.
        # If the secret is missing, you'll see UNSET here, which confirms
        # the 403 is "secret not configured" rather than "PAT lacks scope".
        run: |
          set -u
          if [ -n "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN: SET (length=${#HOMEBREW_TAP_GITHUB_TOKEN})"
          else
            echo "HOMEBREW_TAP_GITHUB_TOKEN: UNSET — add it as a repo secret on"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN: SET (length=${#GITHUB_TOKEN})"
          fi
        env:
          # NOTE: deliberately NO `|| secrets.GITHUB_TOKEN` fallback here.
          # We want to fail fast and visibly when the secret is missing, not
          # silently use the wrong token and 403 in the goreleaser step.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # RFC-0156 Phase 1: one pin, three consumers. Exported into the job
      # environment before goreleaser runs because the kite-collector-osquery
      # build entry's ldflags template bakes OSQUERY_MSI_SHA256 into the binary
      # as its link-time checksum pin (R4, defense in depth). Sourcing rather
      # than cat-ing into $GITHUB_ENV keeps the pin file's ${VERSION}
      # interpolation and quoted multi-value entries working.
      - name: Load the shared osquery pin
        run: |
          set -euo pipefail
          . ./scripts/osquery-pin.env
          {
            echo "OSQUERY_VERSION=${OSQUERY_VERSION}"
            echo "OSQUERY_MSI_SHA256=${OSQUERY_MSI_SHA256}"
            echo "OSQUERY_DEB_SHA256=${OSQUERY_DEB_SHA256}"
            echo "OSQUERY_MSI_URL=${OSQUERY_MSI_URL}"
            echo "OSQUERY_LICENSE_ID=${OSQUERY_LICENSE_ID}"
            echo "OSQUERY_CPE23=${OSQUERY_CPE23}"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo write to VulnerTrack/homebrew-tap requires a PAT (or
          # fine-grained token) with contents:write on that repo. Stored as
          # repo secret HOMEBREW_TAP_GITHUB_TOKEN.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # No SNAPCRAFT_STORE_CREDENTIALS here: goreleaser only BUILDS the
          # .snap files (snapcrafts.publish is off). The Snap Store upload —
          # the one publisher that intermittently drops connections and has
          # no retry — happens in the snap-publish job below.

      # Publish the legacy enrollment agent immediately after the base release.
      # Optional packaging integrations below must never prevent Windows 7
      # targets from receiving the compatibility artifact they require.
      - name: Build and upload Windows 7 32-bit compatibility agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (
            cd legacy/windows7
            GOTOOLCHAIN=go1.17.13 CGO_ENABLED=0 GOOS=windows GOARCH=386 GO386=softfloat go build -trimpath \
              -ldflags="-X main.version=${version}" \
              -o ../../dist/kite-collector_windows_386_legacy.exe .
          )
          (cd dist && sha256sum kite-collector_windows_386_legacy.exe > kite-collector_windows_386_legacy.exe.sha256)
          gh release upload "$GITHUB_REF_NAME" \
            dist/kite-collector_windows_386_legacy.exe \
            dist/kite-collector_windows_386_legacy.exe.sha256 \
            --clobber

      # Hand the .snap files goreleaser built to the snap-publish job. The
      # Snap Store upload lives in its own job so a store hiccup can never
      # fail this release again (v0.50.2 died on RemoteDisconnected after
      # every other channel had published) and so a failed upload can be
      # retried alone via "Re-run failed jobs" — no 15-minute rebuild.
      - name: Stash snaps for snap-publish
        uses: actions/upload-artifact@v7
        with:
          name: snaps
          path: dist/*.snap
          retention-days: 7
          if-no-files-found: error

      # Build the Windows MSIs from the .exe goreleaser just produced and
      # attach them to the GitHub Release as additional assets. Runs after
      # goreleaser publishes so the release already exists for `gh release
      # upload` to target. Pure OSS path — no goreleaser Pro license needed.
      #
      # Two variants from the same wxs:
      #   kite-collector_<v>_amd64.msi          — collector only (unchanged)
      #   kite-collector-osquery_<v>_amd64.msi  — also installs osqueryd as
      #     the kite-osqueryd service; payload harvested from the official
      #     osquery MSI (version + SHA256 pinned in scripts/build-msi.sh).
      #
      # The collector-only MSI also gets a SHA256 checksum asset and a
      # stable unversioned alias (kite-collector_amd64.msi) so scripted
      # deployments can always fetch the latest release by a fixed name.
      - name: Build MSIs and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA:0:7}"
          ./scripts/build-msi.sh "$VERSION" "$COMMIT"
          ./scripts/build-msi.sh "$VERSION" "$COMMIT" --with-osquery
          versioned_msi="kite-collector_${VERSION}_amd64.msi"
          cp "dist/${versioned_msi}" dist/kite-collector_amd64.msi
          (
            cd dist
            sha256sum "${versioned_msi}" > "${versioned_msi}.sha256"
          )
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${versioned_msi}" \
            "dist/${versioned_msi}.sha256" \
            dist/kite-collector_amd64.msi \
            "dist/kite-collector-osquery_${VERSION}_amd64.msi" \
            --clobber

      # Linux counterpart of the osquery-bundle MSI: collector + namespaced
      # kite-osqueryd in one deb (scripts/build-deb-osquery.sh, payload
      # harvested from the official osquery deb, pinned + SHA256-verified).
      # MUST run before the APT-repo step below — that step sweeps
      # dist/*.deb, so the bundle lands in the dynamic APT repository
      # automatically alongside the plain goreleaser deb.
      - name: Build osquery-bundle deb and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-deb-osquery.sh "$VERSION"
          gh release upload "$GITHUB_REF_NAME" \
            "dist/kite-collector-osquery_${VERSION}_amd64.deb" \
            --clobber

      # ──────────────────────────────────────────────
      # RFC-0156: sign, checksum, SBOM and provenance for the Windows
      # installer family (the new self-contained exe plus both MSI products).
      # ──────────────────────────────────────────────

      # Authenticode signing (R9), resolving RFC-0059's Open Question 1. With
      # no SignPath credentials configured the script writes
      # signing_state=unsigned_released and exits 0 — Section 8.1 requires that
      # a signing-service outage (or a not-yet-provisioned certificate, which
      # is the Phase 3 state) degrade the release rather than block it.
      # goreleaser's binary-format archive names the RELEASED asset
      # kite-collector-osquery_windows_amd64.exe but leaves the file on
      # disk at dist/<build-dir>/kite-collector-osquery.exe — the flat
      # path every signing/manifest/attach step below expects does not
      # exist until this staging copy creates it (this exact gap failed
      # the v0.53.0 release at `gh release upload`).
      - name: Stage the osquery-bundle exe under its release name
        run: |
          set -euo pipefail
          src=$(find dist -type f -name 'kite-collector-osquery.exe' | head -1)
          if [ -z "$src" ]; then
            echo "::error::kite-collector-osquery.exe not found anywhere in dist — did the osquery-bundle build run?"
            exit 1
          fi
          cp "$src" dist/kite-collector-osquery_windows_amd64.exe
          echo "staged $src → dist/kite-collector-osquery_windows_amd64.exe"

      - name: Sign Windows installers
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          KITE_CODESIGN_FINGERPRINT_SHA256: ${{ vars.KITE_CODESIGN_FINGERPRINT_SHA256 }}
          KITE_CODESIGN_SUBJECT_CN: ${{ vars.KITE_CODESIGN_SUBJECT_CN }}
          KITE_CODESIGN_ISSUER_CN: ${{ vars.KITE_CODESIGN_ISSUER_CN }}
          KITE_CODESIGN_NOT_BEFORE: ${{ vars.KITE_CODESIGN_NOT_BEFORE }}
          KITE_CODESIGN_NOT_AFTER: ${{ vars.KITE_CODESIGN_NOT_AFTER }}
          KITE_CODESIGN_KEY_CUSTODY: ${{ vars.KITE_CODESIGN_KEY_CUSTODY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/sign-windows-artifact.sh \
            dist/kite-collector-osquery_windows_amd64.exe \
            "dist/kite-collector_${VERSION}_amd64.msi" \
            "dist/kite-collector-osquery_${VERSION}_amd64.msi"

      # Per-artifact SBOM (R12) needs syft on the runner; the repo-wide
      # anchore/sbom-action step below stays as-is.
      - name: Install syft for per-artifact SBOMs
        uses: anchore/sbom-action/download-syft@v0

      # Checksum sidecars for every Windows installer artifact (R8, closing the
      # "only the plain MSI gets one" gap) plus the release-provenance manifest
      # ingest_installer_release_workflow() reads back (Section 5.4).
      - name: Checksum, SBOM and provenance manifest for Windows installers
        run: |
          bash scripts/installer-release-manifest.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # Re-upload with --clobber. goreleaser already published the *unsigned*
      # exe as part of `release --clean`, and the earlier MSI step published
      # MSIs plus a checksum computed before signing — so every artifact the
      # signing step touched, and every sidecar recomputed after it, has to be
      # replaced here or the published checksums would describe bytes nobody
      # can download any more.
      - name: Attach the signed Windows installers and their sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Refresh the stable unversioned alias from the (possibly signed) MSI.
          if [ -f "dist/kite-collector_${VERSION}_amd64.msi" ]; then
            cp "dist/kite-collector_${VERSION}_amd64.msi" dist/kite-collector_amd64.msi
          fi
          assets=(
            dist/kite-collector-osquery_windows_amd64.exe
            dist/kite-collector-osquery_windows_amd64.exe.sha256
            dist/installer-release-manifest.json
            dist/installer-release-manifest.json.sha256
          )
          for optional in \
            dist/kite-collector-osquery_windows_amd64.sbom.spdx.json \
            dist/kite-collector-osquery_windows_amd64.sbom.spdx.json.sha256 \
            "dist/kite-collector_${VERSION}_amd64.msi" \
            "dist/kite-collector_${VERSION}_amd64.msi.sha256" \
            dist/kite-collector_amd64.msi \
            "dist/kite-collector-osquery_${VERSION}_amd64.msi" \
            "dist/kite-collector-osquery_${VERSION}_amd64.msi.sha256"
          do
            if [ -f "$optional" ]; then
              assets+=("$optional")
            fi
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Publish to WinGet
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: VulnerTrack.KiteCollector
          max-retries: 3
          # Pin the manifest to the collector-only MSI. Without this the
          # action's default regex would also sweep the -osquery bundle MSI
          # into the WinGet manifest as a second installer. The bundle stays
          # a GitHub-Releases-only artifact. (The prefix differs — the
          # bundle is "kite-collector-osquery_", so this cannot match it.)
          # The unversioned kite-collector_amd64.msi alias cannot match
          # either — it lacks the underscore-delimited version segment.
          installers-regex: 'kite-collector_[^/]*_amd64\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: kite-collector-sbom.spdx.json
          path: .

      # ──────────────────────────────────────────────
      # Generación Dinámica del Repositorio APT
      # ──────────────────────────────────────────────
      - name: Generar estructura del repositorio APT y firmar
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # 1. Importar clave privada GPG
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch

          # 2. Crear carpetas de arquitectura APT
          mkdir -p public/dists/stable/main/binary-amd64
          mkdir -p public/dists/stable/main/binary-arm64

          # 3. Mover los paquetes .deb creados por GoReleaser al directorio público
          cp dist/*.deb public/dists/stable/main/binary-amd64/ 2>/dev/null || true
          cp dist/*.deb public/dists/stable/main/binary-arm64/ 2>/dev/null || true

          # Limpiar duplicados cruzados dejando solo lo correspondiente a cada arquitectura
          rm -f public/dists/stable/main/binary-amd64/*_arm64.deb
          rm -f public/dists/stable/main/binary-arm64/*_amd64.deb

          # 4. Generar índices de paquetes
          cd public
          dpkg-scanpackages dists/stable/main/binary-amd64 /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9fk dists/stable/main/binary-amd64/Packages

          dpkg-scanpackages dists/stable/main/binary-arm64 /dev/null > dists/stable/main/binary-arm64/Packages
          gzip -9fk dists/stable/main/binary-arm64/Packages

          # 5. Estructurar archivo maestro Release
          cd dists/stable
          echo "Origin: VulnerTrack" > Release
          echo "Label: Kite Collector Repo" >> Release
          echo "Suite: stable" >> Release
          echo "Codename: stable" >> Release
          echo "Architectures: amd64 arm64" >> Release
          echo "Components: main" >> Release
          echo "Description: Repositorio oficial de APT para Kite Collector" >> Release

          echo "MD5Sum:" >> Release
          printf " $(md5sum main/binary-amd64/Packages | cut -d' ' -f1) %s main/binary-amd64/Packages\n" $(wc -c < main/binary-amd64/Packages) >> Release
          printf " $(md5sum main/binary-amd64/Packages.gz | cut -d' ' -f1) %s main/binary-amd64/Packages.gz\n" $(wc -c < main/binary-amd64/Packages.gz) >> Release
          printf " $(md5sum main/binary-arm64/Packages | cut -d' ' -f1) %s main/binary-arm64/Packages\n" $(wc -c < main/binary-arm64/Packages) >> Release
          printf " $(md5sum main/binary-arm64/Packages.gz | cut -d' ' -f1) %s main/binary-arm64/Packages.gz\n" $(wc -c < main/binary-arm64/Packages.gz) >> Release

          echo "SHA256:" >> Release
          printf " $(sha256sum main/binary-amd64/Packages | cut -d' ' -f1) %s main/binary-amd64/Packages\n" $(wc -c < main/binary-amd64/Packages) >> Release
          printf " $(sha256sum main/binary-amd64/Packages.gz | cut -d' ' -f1) %s main/binary-amd64/Packages.gz\n" $(wc -c < main/binary-amd64/Packages.gz) >> Release
          printf " $(sha256sum main/binary-arm64/Packages | cut -d' ' -f1) %s main/binary-arm64/Packages\n" $(wc -c < main/binary-arm64/Packages) >> Release
          printf " $(sha256sum main/binary-arm64/Packages.gz | cut -d' ' -f1) %s main/binary-arm64/Packages.gz\n" $(wc -c < main/binary-arm64/Packages.gz) >> Release

          # 6. Firmar índices con tu clave (79847F85E3FF6E43)
          gpg --batch --yes --clearsign --digest-algo SHA256 -u 79847F85E3FF6E43 -o InRelease Release
          gpg --batch --yes --detach-sign --digest-algo SHA256 -u 79847F85E3FF6E43 -o Release.gpg Release

          # 7. Exportar clave pública al raíz del deployment
          cd ../..
          gpg --armor --export 79847F85E3FF6E43 > repository.key

      - name: Desplegar repositorio a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public

  # ──────────────────────────────────────────────
  # Phase 4: Snap Store publish (v* tags only)
  # ──────────────────────────────────────────────
  # Separate from `release` on purpose. The store's upload endpoint
  # occasionally closes the connection mid-upload without an HTTP response
  # (python-requests reports RemoteDisconnected), snapcraft does not retry,
  # and goreleaser treats the exit code as a publish failure — that combo
  # failed the v0.50.2 release as its final act, after the GitHub release,
  # Docker, Homebrew and Scoop had all published. Here the upload retries
  # with backoff, and if the store is down long enough to exhaust the
  # retries, "Re-run failed jobs" re-runs only this job.
  snap-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    # Same environment binding as `release`: SNAPCRAFT_STORE_CREDENTIALS may
    # be scoped to "Deployment", and environment-scoped secrets are invisible
    # to jobs that do not opt in.
    environment: Deployment
    steps:
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - uses: actions/download-artifact@v7
        with:
          name: snaps
          path: dist

      - name: Upload snaps to the Snap Store (with retries)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -u
          # Fail fast, and distinguishably, when the exported credentials
          # have expired (Ubuntu One macaroons last ~1 year). Retries cannot
          # fix that failure mode, only re-exporting the secret can:
          #   snapcraft export-login --snaps=kite-collector \
          #     --acls=package_access,package_push,package_update,package_release -
          if ! snapcraft whoami; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS is invalid or expired — re-export and update the secret."
            exit 1
          fi
          status=0
          for snap in dist/*.snap; do
            for attempt in 1 2 3 4 5; do
              echo "Uploading $snap (attempt $attempt/5)"
              if snapcraft upload --release=edge,beta,candidate,stable "$snap"; then
                continue 2
              fi
              # Backoff before the next try. Transient store failures
              # (dropped connections, 5xx) usually clear within minutes.
              sleep $((attempt * 30))
            done
            echo "::error::Giving up on $snap after 5 attempts."
            status=1
          done
          exit $status
