# Daily osquery smoke test — understand what could go wrong, early.
#
# Runs the osquery simulation (tests/e2e/osquery) and its diagnostic battery
# every day against TWO targets:
#   - pinned  (5.15.0): the version a kite osquery-backed collector would target
#   - latest          : whatever the osquery apt repo currently publishes
#
# When `latest` fails but `pinned` passes, a new osquery release broke something
# (a renamed table/column, changed --connect behavior, a package/repo change) —
# and you know before adopting it. fail-fast is off so both legs always report.
#
# RFC-0148 added the `pull_request` trigger: a PR touching the osquery
# simulation or the discovery sources it exercises now gets the drift battery
# before merge instead of up to 24h after. The daily cron cadence is unchanged.
#
# Only the `pinned` leg runs on a pull request, and only `pinned` belongs in
# branch protection's required-checks list (R6). The `latest` leg exists to
# catch an upstream osquery release breaking something, which is nothing a PR
# author caused and must never block their merge; RFC-0148 Section 7.3 keeps
# its detection latency at the cron's 24h by design, and Section 11.3 budgets
# only the pinned leg's minutes per push.
name: osquery smoke

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "tests/e2e/osquery/**"
      - "internal/discovery/**"
      - ".github/workflows/osquery-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tests/e2e/osquery/**"
      - ".github/workflows/osquery-smoke.yml"

# R3: `pull_request`, never `pull_request_target`; no secret is referenced here.
permissions:
  contents: read

# R5: a superseding push to the same PR/branch cancels the in-flight run.
concurrency:
  group: osquery-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both legs on the cron / a dispatch / a push to main; pinned only on
        # a pull request. A folded scalar keeps the expression one line, which
        # is what `fromJSON` needs, without a 200-column source line.
        # Every continuation line sits at the same indentation on purpose: a
        # more-indented line in a folded scalar keeps its newline instead of
        # folding to a space, which would put a raw newline inside the
        # single-quoted expression string.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"label":"pinned","osquery_version":"5.15.0"}]'
          || '[{"label":"pinned","osquery_version":"5.15.0"},{"label":"latest","osquery_version":"latest"}]') }}
    # The osquery version is deliberately NOT in the check-run name: branch
    # protection matches on this string, so bumping the 5.15.0 pin would
    # otherwise rename a required check out from under it (R2).
    name: osquery-smoke (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7

      - name: Run osquery diagnostic checks
        working-directory: tests/e2e/osquery
        env:
          OSQUERY_VERSION: ${{ matrix.osquery_version }}
        run: |
          # `run --rm checks` exits with checks.sh's status, so a failed check
          # fails the step. tee keeps the report as an artifact.
          docker compose -f docker-compose.osquery.yml run --rm --build checks \
            | tee checks-${{ matrix.label }}.log

      - name: Tear down
        if: always()
        working-directory: tests/e2e/osquery
        run: docker compose -f docker-compose.osquery.yml down -v || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osquery-checks-${{ matrix.label }}
          path: tests/e2e/osquery/checks-${{ matrix.label }}.log
          if-no-files-found: warn
