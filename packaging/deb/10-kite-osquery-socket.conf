# Installed by kite-collector-osquery to
# /usr/lib/systemd/system/kite-collector.service.d/. Points the collector's
# osquery discovery source at the bundled kite-osqueryd extensions socket —
# the Linux analogue of the machine-wide KITE_OSQUERY_SOCKET the Windows MSI
# sets. Drop-ins apply by unit NAME, so this also augments the
# kite-collector.service that `kite-collector install` registers under
# /etc/systemd/system. Redundant with the client's default-path probing
# (internal/discovery/osquery/socket_unix.go) but explicit beats implicit.
[Service]
Environment=KITE_OSQUERY_SOCKET=/run/kite-osquery/kite-osquery.em
