{
  // osquery configuration shipped by the kite-collector-osquery deb.
  //
  // Installed to:  /etc/kite-collector/osquery/osquery.conf  (conffile)
  // Loaded via:    --config_path on the kite-osqueryd.service command line
  //
  // Path flags (--database_path, --logger_path, --extensions_socket) are NOT
  // set here — they live on the systemd unit's ExecStart so the unit stays
  // the single source of truth for locations. Behavioral flags live in
  // osquery.flags next to this file.
  //
  // The scheduled queries below are a deliberately small heartbeat: the
  // collector's osquery discovery source reads tables on demand over the
  // extensions socket (see tests/e2e/osquery/README.md), so the schedule
  // only proves liveness and exercises the core inventory tables.

  "options": {
    // Splay scheduled queries to avoid synchronized load spikes.
    "schedule_splay_percent": "10"
  },

  "schedule": {
    // Hourly host heartbeat — mirrors the upstream default example query.
    "system_info": {
      "query": "SELECT hostname, uuid, cpu_brand, physical_memory FROM system_info;",
      "interval": 3600,
      "snapshot": true
    },
    // Daily OS inventory — the table CVE matching cares about most.
    "os_version": {
      "query": "SELECT name, version, major, minor, build, platform FROM os_version;",
      "interval": 86400,
      "snapshot": true
    },
    // Daily installed-software inventory (Debian analogue of the Windows
    // bundle's `programs` query).
    "deb_packages": {
      "query": "SELECT name, version, arch FROM deb_packages;",
      "interval": 86400,
      "snapshot": true
    }
  },

  // Decorators append host identity to every result row, matching the
  // upstream default so downstream consumers can rely on host_uuid.
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system_info;",
      "SELECT user AS username FROM logged_in_users ORDER BY time DESC LIMIT 1;"
    ]
  },

  // Bundled community packs (installed under /opt/kite-collector/osquery/
  // packs). All disabled by default — they generate meaningful log volume
  // and nothing ships those logs anywhere yet. Uncomment deliberately.
  "packs": {
    // "vuln-management": "/opt/kite-collector/osquery/packs/vuln-management.conf",
    // "incident-response": "/opt/kite-collector/osquery/packs/incident-response.conf",
    // "it-compliance": "/opt/kite-collector/osquery/packs/it-compliance.conf",
    // "osquery-monitoring": "/opt/kite-collector/osquery/packs/osquery-monitoring.conf",
    // "ossec-rootkit": "/opt/kite-collector/osquery/packs/ossec-rootkit.conf",
    // "hardware-monitoring": "/opt/kite-collector/osquery/packs/hardware-monitoring.conf"
  }
}
