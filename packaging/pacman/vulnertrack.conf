# Drop-in for /etc/pacman.conf (or Include = /etc/pacman.d/vulnertrack).
# Import and locally-sign the vendor key before the first -Sy:
#   curl -fsSL https://vulnertrack.github.io/kite-collector/repository.key \
#     | sudo pacman-key --add -
#   sudo pacman-key --finger KEYID
#   sudo pacman-key --lsign-key KEYID
[vulnertrack]
SigLevel = Required TrustedOnly
Server = https://vulnertrack.github.io/kite-collector/os/$arch
