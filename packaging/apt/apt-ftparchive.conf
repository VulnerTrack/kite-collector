// apt-ftparchive configuration for the Kite Collector APT repository
// (https://vulnertrack.github.io/kite-collector/, published to gh-pages by
// scripts/publish-apt-repo.sh).
//
// This file owns the DECLARATIVE half of the repository: what suites,
// components and architectures exist, and the Release header fields that
// identify the archive. The run-specific half — where the tree lives on
// disk and how long the signature stays valid — is passed as -o overrides
// by the script, so this file needs no templating and is byte-identical
// between a release publish and a nightly re-sign.
//
// Replaces a hand-rolled `dpkg-scanpackages` + eight `printf` checksum
// lines. apt-ftparchive emits MD5Sum/SHA1/SHA256/SHA512 and Date: itself,
// which is the whole reason for the switch: those are the fields a client
// verifies, and hand-maintaining them across two architectures was one
// typo away from an archive apt would reject.

// WHAT BELONGS IN THIS FILE, AND WHAT CANNOT
//
// `apt-ftparchive generate <conf>` parses this file with its own reader,
// which honours only the Dir / Default / TreeDefault / Tree sections below.
// Top-level `APT::FTPArchive::*` switches set here are read INTO the config
// tree too late to affect the run and are silently ignored — verified on
// apt 2.8.3, where `APT::FTPArchive::Contents "false";` in this file
// generated Contents files anyway while the same setting as a command-line
// `-o` suppressed them. Those switches therefore live in
// scripts/publish-apt-repo.sh as -o flags, and nothing here should grow an
// `APT::FTPArchive::` prefix except the Release block, which the `release`
// subcommand does read (it loads this file via -c=, the normal apt path).

Dir {
  // The publish script cds into the archive root before calling generate,
  // so "." is the archive. Do NOT try to override this with
  // -o Dir::ArchiveDir=<path>: the positional config file is read after
  // command-line options, so this line wins and the override vanishes. The
  // symptom is `E: Tree walking failed - ftw` — with exit status 0.
  ArchiveDir ".";
};

Default {
  // Uncompressed + gzip + xz. apt has understood xz since well before the
  // oldest release the ubuntu-matrix suite covers (20.04), and xz is the
  // variant apt actually reaches for, so shipping it saves clients the
  // larger gzip fetch. The uncompressed Packages stays because it costs
  // nothing at this archive size and keeps the tree debuggable with cat.
  Packages::Compress ". gzip xz";
  Sources::Compress ". gzip";
  FileMode 0644;
};

// Contents-<arch> generation is disabled by the publish script's
// -o APT::FTPArchive::Contents=false (see the note above on why it cannot
// be set here). Those files are a path inventory of every package, exist
// for `apt-file`, and nothing in the install path reads them.

TreeDefault {
  // The pool is the state. Both packages (kite-collector and the
  // kite-collector-osquery bundle) live under pool/main/k/<name>/, and
  // apt-ftparchive files each deb into binary-<arch>/Packages by reading
  // the control Architecture field — no per-arch directory juggling, and
  // no way for an amd64 deb to leak into the arm64 index.
  Directory "pool/$(SECTION)";
};

Tree "dists/stable" {
  Sections "main";
  Architectures "amd64 arm64";
};

APT::FTPArchive::Release {
  Origin "VulnerTrack";
  Label "Kite Collector Repo";
  Suite "stable";
  Codename "stable";
  Architectures "amd64 arm64";
  Components "main";
  Description "Repositorio oficial de APT para Kite Collector";
  // Tells apt which key is expected to have signed this archive, so a
  // client that added the repo without `signed-by=` still pins to this
  // fingerprint rather than trusting any key in its global keyring.
  // Overridden with -o ...::Signed-By=<fingerprint> by the script when a
  // signing key is configured; absent on an unsigned local test build.
  //
  // NOT set here as a literal: the fingerprint belongs with the key
  // material in CI, and a stale fingerprint in a checked-in file would
  // silently invalidate the archive for every client after a key rotation.

  // Acquire-By-Hash is deliberately NOT advertised. The field only claims
  // support; the by-hash/SHA256/<digest> objects it promises have to be
  // materialised by the publisher, and apt-ftparchive does not create
  // them. Advertising it without those files makes apt request URLs that
  // 404 — a hard `apt update` failure, fleet-wide.
};
