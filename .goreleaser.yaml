version: 2

# Pre-build hooks. Run once before any `builds:` entry kicks off — output
# of the rsrc step (cmd/kite-collector/rsrc_windows_amd64.syso) is picked
# up automatically by the Go toolchain when GOOS=windows. Without this,
# the released kite-collector.exe would lack the embedded UAC manifest +
# Common-Controls 6.0 dependency that the install wizard relies on.
before:
  hooks:
    - go mod tidy
    - go install github.com/akavel/rsrc@latest
    - rsrc -manifest cmd/kite-collector/app.manifest -arch amd64 -o cmd/kite-collector/rsrc_windows_amd64.syso

builds:
  - id: kite-collector
    main: ./cmd/kite-collector
    binary: kite-collector
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - '{{ if eq .Os "windows" }}-H=windowsgui{{ end }}'
    # FreeBSD and OpenBSD are tier-2: they cross-compile cleanly with
    # CGO_ENABLED=0 and the pure-Go modernc.org/sqlite driver, but have no
    # CI runtime tests yet. Identity hardening (TPM, OS keyring) silently
    # falls back to plain-disk on these platforms — same behavior as
    # darwin/windows for the keyring backend.
    # NetBSD + Dragonfly are intentionally excluded: modernc.org/sqlite
    # v1.48.1 has an upstream bug on those targets (mu.enter/mu.leave
    # undefined). Re-add when the driver is patched.
    # Build order: linux first (primary deployment target), then windows
    # (largest user base after linux), then darwin (developer workstations),
    # then BSDs (tier-2).
    goos: [linux, windows, darwin, freebsd, openbsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
  # RFC-0156: the self-contained Windows installer. Same program, compiled
  # with -tags osquery_bundle so internal/installer carries a
  # checksum-verified osqueryd payload via go:embed and registers it as the
  # kite-osqueryd sibling service on install.
  #
  # A separate build entry rather than a variant of the default one is what
  # makes R2 structural instead of aspirational: the plain
  # flat-binary/wizard/MSI channels compile without the tag and therefore
  # cannot accidentally inherit osqueryd's attack surface or its ~55 MB.
  #
  # Note this entry needs OSQUERY_MSI_SHA256 in the environment (the release
  # job exports it from scripts/osquery-pin.env). That is deliberate: a build
  # that cannot see the pin must fail rather than produce an installer with no
  # link-time checksum binding.
  - id: kite-collector-osquery
    main: ./cmd/kite-collector
    binary: kite-collector-osquery
    env:
      - CGO_ENABLED=0
    tags:
      - osquery_bundle
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -H=windowsgui
      # R4, defense in depth: installer.VerifyBundle refuses to install unless
      # this link-time digest matches the embedded manifest's vendored_sha256.
      # A future refactor that drops the verified staging step then produces an
      # installer that cannot install, not one that silently ships unverified
      # bytes.
      - -X github.com/vulnertrack/kite-collector/internal/installer.vendoredOsquerySHA256={{ .Env.OSQUERY_MSI_SHA256 }}
    # windows/arm64 stays excluded, matching the default build entry, and
    # osquery's own Windows-arm64 support maturity is unconfirmed (Section 12,
    # Open Question 4).
    goos: [windows]
    goarch: [amd64]
    hooks:
      pre:
        # Downloads the pinned osquery MSI once into dist/cache/ (shared with
        # build-msi.sh), SHA256-verifies it fail-closed, and stages the
        # harvested payload into the go:embed tree.
        - bash scripts/stage-osquery-embed.sh
  # The snap needs a distinct app entry for snapd to supervise. It is the
  # same program with `service run` supplied by snap metadata; keeping it as
  # a second Linux-only binary lets the normal CLI remain interactive.
  - id: kite-collector-snap-daemon
    main: ./cmd/kite-collector
    binary: kite-collector-daemon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux]
    goarch: [amd64, arm64]

# Tarball for Homebrew (brews requires tar.gz, not raw binaries).
archives:
  - id: homebrew
    ids: [kite-collector]
    formats: [tar.gz]
    name_template: "kite-collector_{{ .Os }}_{{ .Arch }}"
  # Flat binary distribution — single file download, no tar.gz.
  - id: flat
    ids: [kite-collector]
    formats: [binary]
    name_template: "kite-collector_{{ .Os }}_{{ .Arch }}_bin"
  # RFC-0156 R1: the one self-contained artifact. Named to mirror the existing
  # kite-collector-osquery deb/MSI so the three formats of the same payload are
  # recognisably siblings, and named distinctly enough that the WinGet
  # publisher's installers-regex (which pins the plain MSI) cannot sweep it up.
  - id: osquery-bundle
    ids: [kite-collector-osquery]
    formats: [binary]
    name_template: "kite-collector-osquery_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Linux packages via nfpm.
#
# The kite-collector-osquery bundle deb is NOT built here — goreleaser OSS
# can't stage the harvested osquery payload. scripts/build-deb-osquery.sh
# builds it in the release workflow, from packaging/deb/nfpm-osquery.yaml.
# The conflicts line below is the plain side of the swap semantics both
# packages declare (install one, apt removes the other).
nfpms:
  - id: packages
    ids: [kite-collector]
    package_name: kite-collector
    conflicts:
      - kite-collector-osquery
    vendor: VulnerTrack
    homepage: https://github.com/VulnerTrack/kite-collector
    maintainer: VulnerTrack <hello@vulnertrack.dev>
    description: Cybersecurity machine discovery, configuration audit, and posture analysis agent.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: configs/kite-collector.example.yaml
        dst: /etc/kite-collector/kite-collector.example.yaml
        type: config

# Homebrew Cask — GoReleaser auto-generates the cask and pushes it to
# the tap repo on every v* release.
homebrew_casks:
  - name: kite-collector
    ids: [homebrew]
    binaries: [kite-collector]
    repository:
      owner: VulnerTrack
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/VulnerTrack/kite-collector
    description: "Cybersecurity machine discovery, configuration audit, and posture analysis agent"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kite-collector"]
          end

# Configuración para la Snap Store
snapcrafts:
  - id: default
    ids: [kite-collector, kite-collector-snap-daemon]
    name: kite-collector
    summary: Cybersecurity machine discovery and posture analysis agent.
    description: |
      Kite Collector is a cybersecurity machine discovery, configuration audit,
      and posture analysis agent developed by VulnerTrack.
    # publish stays off: the Snap Store upload endpoint intermittently drops
    # connections mid-upload (RemoteDisconnected — it killed the v0.50.2
    # release after everything else had published) and neither goreleaser
    # nor snapcraft retries. The .snap files built here are uploaded by the
    # snap-publish workflow job, which retries with backoff and can be
    # re-run on its own without rebuilding the release.
    publish: false
    grade: stable
    confinement: strict
    base: core22
    license: MIT
    apps:
      kite-collector:
        plugs:
          - hardware-observe
          - home
          - mount-observe
          - network
          - network-bind
          - network-observe
          - system-observe
      kite-collector-daemon:
        args: service run
        daemon: simple
        install_mode: disable
        restart_condition: on-failure
        plugs:
          - hardware-observe
          - home
          - mount-observe
          - network
          - network-bind
          - network-observe
          - system-observe

# Scoop manifests
scoops:
  - name: kite-collector
    ids: [homebrew]
    repository:
      owner: VulnerTrack
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: scoop
    homepage: https://github.com/VulnerTrack/kite-collector
    description: "Cybersecurity machine discovery, configuration audit, and posture analysis agent"
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
